name: ZakaPro CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Validate serverless JavaScript
        run: find api -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Enforce Vercel Hobby function limit
        shell: bash
        run: |
          set -euo pipefail
          count=$(find api -type f -name '*.js' ! -name '_*' ! -name '.*' ! -name '*.d.ts' | wc -l | tr -d ' ')
          echo "Deployable Vercel Functions: ${count}"
          if [ "$count" -gt 12 ]; then
            echo "ERROR: Vercel Hobby supports at most 12 serverless functions. Consolidate API routes before deploying."
            find api -type f -name '*.js' ! -name '_*' ! -name '.*' ! -name '*.d.ts' | sort
            exit 1
          fi
      - name: Production build
        run: npm run build
